spring.application.name=E-CommerceBackendProject

# Port
# server.port=5048
server.port=${PORT:8080}

# MySQL Database Configuration
# spring.datasource.url=jdbc:mysql://localhost:3306/ecommerceDb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerceDb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false 

# Format SQL in logs (optional but makes show-sql readable)
spring.jpa.properties.hibernate.format_sql=true  

# server.servlet.context-path=/api/v1

server.error.include-message=always
server.error.include-exception=true

# Redis
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.cache.type=redis